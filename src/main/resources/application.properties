server.port=8080
omdb.api.key=${OMDB_API_KEY:}

# H2 (dev)
spring.datasource.url=jdbc:h2:mem:omdbdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# Caffeine (dev)
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=200,expireAfterWrite=5m

# Actuator
management.endpoints.web.exposure.include=health,info

# Disable Redis health check for local dev if Redis is not running
management.health.redis.enabled=false